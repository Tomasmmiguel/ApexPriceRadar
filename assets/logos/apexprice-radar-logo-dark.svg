<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560" height="160">
  <!-- ============ ÍCONE ============ -->
  <!-- "Apex" (pico) formado por duas linhas em V invertido para fundos claros -->
  <polyline points="26,118 78,42 130,118"
            fill="none" stroke="#1B1D23" stroke-width="9"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ondas de radar emanando do pico -->
  <path d="M 60 30 A 22 22 0 0 1 96 30"
        fill="none" stroke="#FF6A2B" stroke-width="3" stroke-linecap="round"/>
  <path d="M 50 18 A 34 34 0 0 1 106 18"
        fill="none" stroke="#FF6A2B" stroke-width="3" stroke-linecap="round" opacity="0.55"/>

  <!-- Blip / preço detetado -->
  <circle cx="78" cy="42" r="6.5" fill="#FF6A2B"/>

  <!-- ============ WORDMARK ============ -->
  <text x="168" y="80"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="40" font-weight="700" letter-spacing="0.5"
        fill="#1B1D23">ApexPrice</text>

  <text x="168" y="112"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="22" font-weight="500" letter-spacing="6"
        fill="#FF6A2B">RADAR</text>
</svg>
